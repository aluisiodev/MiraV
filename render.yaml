# Blueprint do Render (plano gratuito) para a API em Go.
# O banco fica no Neon (gratuito e sem prazo de expiração): cole a URL em DATABASE_URL.
services:
  - type: web
    name: visavision-api
    runtime: docker
    rootDir: api
    plan: free
    region: virginia # perto do banco no Neon (aws-us-east-1): a API e o banco conversam mais rápido
    # /vivo não consulta o banco; com /saude, as checagens do Render manteriam o Neon sempre acordado
    healthCheckPath: /vivo
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: IP_SALT
        generateValue: true
